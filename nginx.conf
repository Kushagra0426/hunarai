events {
    worker_connections 4096;
}

http {
    # Least-connections, not round-robin: these are long-lived sessions of
    # unpredictable duration, so counting requests is the wrong measure. A node
    # that took a burst of hour-long sessions should stop receiving new ones even
    # though it has served few requests.
    #
    # Deliberately not ip_hash. Pinning a client to a node would hide exactly what
    # the chaos scripts need to show: that a drained node's clients land somewhere
    # else on reconnect.
    upstream connmgr {
        least_conn;
        server node1:8000 max_fails=2 fail_timeout=5s;
        server node2:8000 max_fails=2 fail_timeout=5s;
        server node3:8000 max_fails=2 fail_timeout=5s;
    }

    # WebSocket handshake sends "Upgrade"; ordinary requests send nothing, and
    # passing an empty Connection header through would break keepalive. This maps
    # one to the other.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format upstream '$remote_addr -> $upstream_addr "$request" $status';
    access_log /var/log/nginx/access.log upstream;

    server {
        listen 8080;

        location / {
            proxy_pass http://connmgr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Sessions last from seconds to hours, so the default 60s read
            # timeout would kill idle-but-healthy connections. A day is longer
            # than any session this is built for.
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Retry the next node when one is draining or gone, so a deploy does
            # not surface as errors to clients. 503 is what a draining node's
            # /health returns.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
