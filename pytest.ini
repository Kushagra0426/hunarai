[pytest]
# settings_test, not settings: it pins sqlite and Redis db 15 regardless of the
# environment. Pointing this at connmgr.settings would let a developer's
# DATABASE_URL create a test database on production Postgres.
DJANGO_SETTINGS_MODULE = connmgr.settings_test
python_files = test_*.py
testpaths = tests
asyncio_mode = auto
# Each test gets a fresh event loop; the module-level Redis client is closed
# between them by the conftest fixture so it never outlives its loop.
asyncio_default_fixture_loop_scope = function
